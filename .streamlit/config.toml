# Streamlit configuration for BlueEye.
# maxUploadSize is aligned with BLUEEYE_MAX_VIDEO_MB (app/config.py default),
# otherwise Streamlit's built-in 200 MB cap would reject uploads before
# BlueEye's own validation runs.
[server]
maxUploadSize = 400
headless = true

[browser]
gatherUsageStats = false

# BlueEye renders its own 8-entry navigation in the sidebar (see
# app/ui/theme.py: PAGES). Streamlit also auto-discovers the sibling
# "pages/" directory as a multipage app, which would add a second,
# duplicate navigation list; hide it so the sidebar stays clean.
[client]
showSidebarNavigation = false

# BlueEye marine design system (see app/ui/theme.py for the CSS tokens).
# Dark navy base: Streamlit's own widgets follow the tokens below, while
# BlueEye's custom HTML (cards, hero, tables) uses the --be-* variables.
[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#041428"
secondaryBackgroundColor = "#0a233d"
textColor = "#e8f4fb"
font = "sans serif"
